<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acomodação - Living Around</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="acomodacao.css" />
  </head>
  <body>
    <header class="position-relative">
      <img
        src="img/acomodacao-bg.png"
        alt="Hero"
        class="img-fluid w-100 hero-img"
      />
      <nav
        class="navbar navbar-expand-lg navbar-light bg-transparent position-absolute w-100"
        style="top: 0; left: 0; z-index: 10"
      >
        <div class="container-fluid">
          <a
            class="navbar-brand fw-bold d-flex align-items-center"
            href="index.html"
          >
            <img
              src="icons/logo.svg"
              alt="Living Around"
              style="height: 36px; width: auto"
            />
          </a>
          <button
            class="navbar-toggler ms-auto"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#nav"
            aria-controls="nav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="nav">
            <ul
              class="navbar-nav gap-5 align-items-end text-end align-items-lg-center ms-lg-0"
            >
              <li class="nav-item">
                <a class="nav-link fw-semibold" href="acomodacao.html"
                  >Acomodação</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link fw-semibold" href="locals.html">Locais</a>
              </li>
              <li class="nav-item">
                <a class="nav-link fw-semibold" href="#">Blog</a>
              </li>
              <li class="nav-item">
                <a class="nav-link fw-semibold" href="contacts.html"
                  >Contatos</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <div
        class="position-absolute top-50 start-50 translate-middle text-white text-center"
        style="z-index: 11; width: 100%"
      >
        <h1 class="display-4 text-uppercase fw-bold">O seu novo office</h1>
      </div>
    </header>

    <main class="py-5 acomodacao-page" style="background: #efe7cc">
      <div class="container">
        <div class="row">
          <div class="col-12">
            <div class="text-center py-6">
              <h2 class="display-6">Em breve</h2>
              <p class="lead">Estamos atualizando nossas opções de acomodação. Volte em breve para ver as novidades.</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-black text-white text-center py-4">
      <div class="container">
        <h5 class="mb-4">LIVING AROUND</h5>
        <div
          class="mb-4 d-flex gap-3 justify-content-center"
          role="navigation"
          aria-label="Redes sociais"
        >
          <a
            href="#"
            class="text-white d-inline-flex align-items-center justify-content-center"
            aria-label="Facebook"
            ><img src="icons/facebook.svg" alt="Facebook" class="footer-icon"
          /></a>
          <a
            href="#"
            class="text-white d-inline-flex align-items-center justify-content-center"
            aria-label="Instagram"
            ><img src="icons/instagram.svg" alt="Instagram" class="footer-icon"
          /></a>
          <a
            href="#"
            class="text-white d-inline-flex align-items-center justify-content-center"
            aria-label="Twitter"
            ><img src="icons/twitter.svg" alt="Twitter" class="footer-icon"
          /></a>
        </div>
        <p class="mb-0">Power by Cesae Digital</p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
