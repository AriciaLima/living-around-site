<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contatos - Living Around</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="contacts.css" />
  </head>
  <body>
    <header class="position-absolute w-100" style="top: 0; z-index: 50">
      <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container-fluid">
          <a
            class="navbar-brand fw-bold d-flex align-items-center"
            href="index.html"
          >
            <img
              src="icons/logo.svg"
              alt="Living Around"
              style="height: 36px; width: auto"
            />
          </a>
          <button
            class="navbar-toggler ms-auto"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#nav"
            aria-controls="nav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="nav">
            <ul
              class="navbar-nav gap-4 align-items-end text-end align-items-lg-center ms-lg-0"
            >
              <li class="nav-item">
                <a class="nav-link" href="acomodacao.html">Acomodação</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="locals.html">Locais</a>
              </li>
              <li class="nav-item"><a class="nav-link" href="#">Blog</a></li>
              <li class="nav-item">
                <a class="nav-link" href="contacts.html">Contatos</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="contacts-page position-relative">
      <!-- Background image: replace src in CSS or inline below -->
      <div class="contacts-bg"></div>

      <div class="container py-5">
        <div class="row align-items-center" style="min-height: 75vh">
          <!-- Form card (esquerda) -->
          <div class="col-12 col-md-5">
            <div class="contact-card p-4 rounded-3 shadow-lg">
              <form novalidate>
                <div class="mb-3">
                  <label for="contact-name" class="form-label small text-white"
                    >Nome:</label
                  >
                  <input
                    id="contact-name"
                    name="name"
                    class="form-control"
                    type="text"
                  />
                  <div class="invalid-feedback">
                    Por favor, informe seu nome.
                  </div>
                </div>
                <div class="mb-3">
                  <label for="contact-email" class="form-label small text-white"
                    >Email:</label
                  >
                  <input
                    id="contact-email"
                    name="email"
                    class="form-control"
                    type="email"
                  />
                  <div class="invalid-feedback">
                    Por favor, informe um e-mail válido.
                  </div>
                </div>
                <div class="mb-3">
                  <label
                    for="contact-message"
                    class="form-label small text-white"
                    >Mensagem:</label
                  >
                  <textarea
                    id="contact-message"
                    name="message"
                    class="form-control"
                    rows="6"
                  ></textarea>
                  <div class="invalid-feedback">
                    Por favor, escreva uma mensagem.
                  </div>
                </div>
                <button
                  class="btn btn-outline-light rounded-pill px-4 py-2"
                  type="submit"
                >
                  Enviar
                </button>
              </form>
            </div>
          </div>

          <!-- Quote / callout (direita) -->
          <div class="col-12 col-md-7 text-md-end text-light">
            <blockquote class="blockquote fs-4">
              "Viajar é descobrir que todos estão errados sobre outros países."
              <footer class="blockquote-footer text-white-50 mt-3">
                Aldous Huxley
              </footer>
            </blockquote>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
    <!-- Success modal (custom look) -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div
          class="modal-content border-0 shadow-sm rounded-4 bg-white text-center p-4 success-modal-custom"
        >
          <div class="modal-body pt-3">
            <p class="mb-4 text-dark small">
              Seu formulário foi enviado com sucesso!
            </p>
            <button
              type="button"
              class="btn btn-success-modal px-4 py-2"
              data-bs-dismiss="modal"
            >
              Ok
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
