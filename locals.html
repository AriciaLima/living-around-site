<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locais - Living Around</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="locals-page">
    <header class="position-absolute w-100 top-0 z-3">
      <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container-fluid">
          <a
            class="navbar-brand fw-bold d-flex align-items-center"
            href="index.html"
          >
            <img src="icons/logo.svg" alt="Living Around" class="brand-logo" />
          </a>
          <button
            class="navbar-toggler ms-auto"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#nav"
            aria-controls="nav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="nav">
            <ul
              class="navbar-nav gap-4 align-items-end text-end align-items-lg-center ms-lg-0"
            >
              <li class="nav-item">
                <a class="nav-link" href="acomodacao.html">Acomodação</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="locals.html">Locais</a>
              </li>
              <li class="nav-item"><a class="nav-link" href="#">Blog</a></li>
              <li class="nav-item">
                <a class="nav-link" href="contacts.html">Contatos</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="position-relative">
      <!-- Fundo da página -->
      <div class="locals-bg"></div>

      <!-- Conteúdo -->
      <div
        class="container min-vh-100 d-flex align-items-center justify-content-center"
      >
        <div class="row g-4 align-items-start justify-content-center">
          <div class="col-12 col-md-auto align-self-start">
            <div class="locals-card p-4">
              <form>
                <div class="mb-4">
                  <label for="country" class="form-label small"
                    >Escolha o país:</label
                  >
                  <div class="input-group">
                    <select id="country" class="form-select">
                      <option value="" selected>país</option>
                      <option value="br">Brasil</option>
                      <option value="pt">Portugal</option>
                      <option value="es">Espanha</option>
                    </select>
                  </div>
                </div>
                <div class="mb-4">
                  <label for="city" class="form-label small"
                    >Escolha a cidade:</label
                  >
                  <div class="input-group">
                    <select id="city" class="form-select">
                      <option value="" selected>cidade</option>
                    </select>
                  </div>
                </div>
                <div class="d-grid">
                  <button type="button" class="btn btn-brand">Ver</button>
                </div>
              </form>
            </div>
          </div>
          <!-- Coluna do mapa e card de endereço (inicia oculta) -->
          <div
            id="map-block"
            class="col-12 col-md-auto d-flex flex-column align-items-start gap-3 align-self-start d-none"
          >
            <div id="map" class="locals-map rounded-3 shadow"></div>
            <div class="locals-addr-card text-white rounded-3 p-4">
              <h6 class="fw-bold mb-2">
                LIVING AROUND - <span id="la-city">Porto</span>
              </h6>
              <p class="mb-1 small" id="la-address">
                Rua da Alegria, 666<br />4000-789 - Porto
              </p>
              <p class="mb-0 small" id="la-email">
                livingaround_porto@living.com
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
